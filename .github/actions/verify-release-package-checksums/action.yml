name: verify release package checksums
description: Verify both Host ZIPs and their outer checksum manifest
inputs:
  platform:
    required: true
    description: Release package platform
  package-artifact:
    required: true
    description: ZIP artifact name
  checksum-artifact:
    required: true
    description: Checksum artifact name
runs:
  using: composite
  steps:
    - name: Download release ZIPs
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.package-artifact }}
        path: dist
    - name: Download release checksums
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.checksum-artifact }}
        path: dist
    - name: Verify ZIPs and checksums
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        version="$(cat VERSION)"
        for host in codex claude; do
          zip="agent-work-kit-v${version}-${host}-${PLATFORM}.zip"
          python3 -B .github/scripts/release/release_package_integrity.py verify-zip "dist/$zip"
        done
        test "$(cat dist/SHA256SUMS.txt)" = "$(cd dist && sha256sum "agent-work-kit-v${version}-codex-${PLATFORM}.zip" "agent-work-kit-v${version}-claude-${PLATFORM}.zip")"
        cd dist
        sha256sum --check --strict SHA256SUMS.txt
