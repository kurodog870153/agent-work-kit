name: main release coordination

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit checked by the Rust CI workflows
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: work-main-release
  cancel-in-progress: false

jobs:
  verify-main-ci-and-start-release:
    name: verify main CI and start release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check main CI and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ inputs.expected_sha }}
        run: python3 .github/scripts/release/main_release_coordinator.py
