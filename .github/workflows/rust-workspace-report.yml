name: report Rust workspace validation

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.report-rust-workspace.outputs.tag }}
      version:
        value: ${{ jobs.report-rust-workspace.outputs.version }}
      macos-artifact-attempt:
        value: ${{ jobs.report-rust-workspace.outputs.macos-artifact-attempt }}
      windows-artifact-attempt:
        value: ${{ jobs.report-rust-workspace.outputs.windows-artifact-attempt }}
      release-content-artifact-attempt:
        value: ${{ jobs.report-rust-workspace.outputs.release-content-artifact-attempt }}
    inputs:
      release:
        type: boolean
        required: true
      macos-artifact-attempt:
        type: string
        required: false
      windows-artifact-attempt:
        type: string
        required: false
      release-content-artifact-attempt:
        type: string
        required: false
      tag:
        type: string
        required: false
      version:
        type: string
        required: false

permissions:
  contents: read

jobs:
  report-rust-workspace:
    name: report Rust workspace and installed CLI validation
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      macos-artifact-attempt: ${{ inputs.macos-artifact-attempt }}
      windows-artifact-attempt: ${{ inputs.windows-artifact-attempt }}
      release-content-artifact-attempt: ${{ inputs.release-content-artifact-attempt }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source for Rust workspace report
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download macOS Rust workspace results
        uses: actions/download-artifact@v8
        with:
          name: rust-perf-macos
          path: evidence/rust-macos
      - name: Download Windows Rust workspace results
        uses: actions/download-artifact@v8
        with:
          name: rust-perf-x86_64-pc-windows-msvc
          path: evidence/rust-windows
      - name: Download macOS installed CLI smoke
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release && format('cli-smoke-macos-arm64-attempt-{0}', inputs.macos-artifact-attempt) || 'cli-smoke-pr-macos-arm64' }}
          path: evidence/smoke-macos
      - name: Download Windows installed CLI smoke
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release && format('cli-smoke-windows-x64-msvc-attempt-{0}', inputs.windows-artifact-attempt) || 'cli-smoke-pr-windows-x64-msvc' }}
          path: evidence/smoke-windows
      - name: Compose Rust workspace report
        run: |
          python3 -B .github/scripts/release/rust_workspace_report.py \
            --rust-macos-arm64 evidence/rust-macos \
            --rust-windows-x64-msvc evidence/rust-windows \
            --smoke-macos-arm64 evidence/smoke-macos \
            --smoke-windows-x64-msvc evidence/smoke-windows \
            --commit "$GITHUB_SHA" --output dist/rust-workspace-report.md
      - name: Upload Rust workspace report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('rust-workspace-report-attempt-{0}', github.run_attempt) || 'rust-workspace-report-pr' }}
          path: dist/rust-workspace-report.md
          if-no-files-found: error
