name: pr release validation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-preflight:
    name: validate release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for release validation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Test version guard
        run: python3 -B -m unittest discover -s .github/scripts/tests/version-guard -p test_version_guard.py
      - name: Validate pull request version
        run: python3 -B .github/scripts/version-guard/version_guard.py
      - name: Run shared validation preflight
        uses: ./.github/actions/validation-preflight
      - name: Check proposed release version is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release/release_version_availability.py
      - name: Validate release content declarations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -B .github/scripts/release/release_content.py --repository "$REPOSITORY" --pr-number "$PR_NUMBER"

  rust-ci:
    name: rust validation
    needs: validate-release-preflight
    uses: ./.github/workflows/rust-validation.yml
    permissions:
      contents: read
      actions: read

  package-ci:
    name: build and validate packages
    needs: rust-ci
    uses: ./.github/workflows/build-and-validate-packages.yml
    with:
      macos-rust-attempt: ${{ needs.rust-ci.outputs.macos-rust-attempt }}
      windows-rust-attempt: ${{ needs.rust-ci.outputs.windows-rust-attempt }}
    permissions:
      contents: read
      actions: read

  rust-validation-evidence:
    name: rust validation evidence
    needs: package-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source for rust validation evidence
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Rust and installed Host evidence
        uses: ./.github/actions/rust-validation-evidence
        with:
          macos-artifact-attempt: ${{ needs.package-ci.outputs.macos-artifact-attempt }}
          windows-artifact-attempt: ${{ needs.package-ci.outputs.windows-artifact-attempt }}
          macos-rust-attempt: ${{ needs.package-ci.outputs.macos-rust-attempt }}
          windows-rust-attempt: ${{ needs.package-ci.outputs.windows-rust-attempt }}

  confirm-release-validation:
    name: confirm release validation
    if: always()
    needs: rust-validation-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust workspace evidence to pass
        env:
          EVIDENCE_VALIDATION: ${{ needs.rust-validation-evidence.result }}
        run: |
          if [[ "$EVIDENCE_VALIDATION" != success ]]; then
            echo "Rust workspace evidence did not pass: $EVIDENCE_VALIDATION"
            exit 1
          fi

  generate-workflow-summary:
    name: generate workflow summary
    if: always()
    needs: confirm-release-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    continue-on-error: true
    steps:
      - name: Check out source for workflow summary
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci/workflow_summary.py pr
