name: pr release validation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-release-preflight:
    name: validate release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for release validation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Test version guard
        run: python3 -B -m unittest discover -s .github/scripts/tests/version-guard -p test_version_guard.py
      - name: Validate pull request version
        run: python3 -B .github/scripts/version-guard/version_guard.py
      - name: Set up Ruby for workflow YAML checks
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Check workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { YAML.parse_file(it) }'
      - name: Check approved workflow actions
        run: python3 -B .github/scripts/release/check_workflow_actions.py
      - name: Test release scripts
        run: python3 -B -m unittest discover -s .github/scripts/tests/release -p 'test_*.py'
      - name: Check proposed release version is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release/release_version_availability.py
      - name: Validate release content declarations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -B .github/scripts/release/release_content.py --repository "$REPOSITORY" --pr-number "$PR_NUMBER"

  rust-ci:
    name: rust validation
    needs: validate-release-preflight
    uses: ./.github/workflows/rust-validation.yml
    permissions:
      contents: read
      actions: read

  package-ci:
    name: build and validate packages
    needs: rust-ci
    uses: ./.github/workflows/build-and-validate-packages.yml
    permissions:
      contents: read
      actions: read

  rust-validation-report:
    name: Rust validation report
    needs: package-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source for Rust validation report
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate evidence and upload report
        uses: ./.github/actions/rust-validation-report
        with:
          release: 'false'

  confirm-release-validation:
    name: confirm release validation
    if: always()
    needs: rust-validation-report
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust workspace report to pass
        env:
          REPORT_VALIDATION: ${{ needs.rust-validation-report.result }}
        run: |
          if [[ "$REPORT_VALIDATION" != success ]]; then
            echo "Rust workspace report did not pass: $REPORT_VALIDATION"
            exit 1
          fi
