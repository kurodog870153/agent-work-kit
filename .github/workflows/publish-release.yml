name: publish release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-work-kit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-ci:
    name: rust validation
    uses: ./.github/workflows/rust-validation.yml
    permissions:
      contents: read
      actions: read

  prepare-release-content:
    name: prepare release content before tag
    needs: rust-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    steps:
      - name: Check out source for release content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record version tag
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check unpublished release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py first-attempt --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Validate and prepare release content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py notes --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --title-file release-title.txt --notes-file release-notes.md --manifest-file release-content.json
      - name: Upload validated release content
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-content-attempt-${{ github.run_attempt }}
          path: |
            release-title.txt
            release-notes.md
            release-content.json
          if-no-files-found: error

      - name: Record content artifact attempt
        id: artifact-attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  create-release-tag:
    name: create release tag
    needs: prepare-release-content
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release-content-artifact-attempt: ${{ needs.prepare-release-content.outputs.artifact-attempt }}
    steps:
      - name: Check out source for version tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download validated release content
        uses: actions/download-artifact@v8
        with:
          name: validated-release-content-attempt-${{ needs.prepare-release-content.outputs.artifact-attempt }}
      - name: Verify prepared content identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare-release-content.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py verify-content --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --title-file release-title.txt --notes-file release-notes.md --manifest-file release-content.json
      - name: Create version tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_tag_creation.py --repository "$REPOSITORY" --expected-sha "$EXPECTED_SHA"

  validate-release-publication:
    name: validate release publication
    needs: create-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ needs.create-release-tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release-content-artifact-attempt: ${{ needs.create-release-tag.outputs.release-content-artifact-attempt }}
    steps:
      - name: Check out source for tag validation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check unpublished release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.create-release-tag.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py first-attempt --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --tag-created
      - name: Validate tag, commit, version and lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.create-release-tag.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Record version
        id: version
        env:
          TAG: ${{ needs.create-release-tag.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  package-ci:
    name: build and validate packages
    needs: validate-release-publication
    uses: ./.github/workflows/build-and-validate-packages.yml
    with:
      release: true
      tag: ${{ needs.validate-release-publication.outputs.tag }}
      release-content-artifact-attempt: ${{ needs.validate-release-publication.outputs.release-content-artifact-attempt }}
    permissions:
      contents: read
      actions: read

  rust-validation-report:
    name: Rust validation report
    needs: package-ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.package-ci.outputs.tag }}
      version: ${{ needs.package-ci.outputs.version }}
      macos-artifact-attempt: ${{ needs.package-ci.outputs.macos-artifact-attempt }}
      windows-artifact-attempt: ${{ needs.package-ci.outputs.windows-artifact-attempt }}
      release-content-artifact-attempt: ${{ needs.package-ci.outputs.release-content-artifact-attempt }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source for Rust validation report
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate evidence and upload report
        uses: ./.github/actions/rust-validation-report
        with:
          release: 'true'
          macos-artifact-attempt: ${{ needs.package-ci.outputs.macos-artifact-attempt }}
          windows-artifact-attempt: ${{ needs.package-ci.outputs.windows-artifact-attempt }}

  verify-and-attest-release-assets:
    name: verify and attest release assets
    needs: rust-validation-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ needs.rust-validation-report.outputs.tag }}
      version: ${{ needs.rust-validation-report.outputs.version }}
      release-content-artifact-attempt: ${{ needs.rust-validation-report.outputs.release-content-artifact-attempt }}
      manifest_sha256: ${{ steps.digest.outputs.manifest_sha256 }}
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    steps:
      - name: Check out source for asset verification
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download macOS release ZIPs
        uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64-attempt-${{ needs.rust-validation-report.outputs.macos-artifact-attempt }}
          path: dist
      - name: Download Windows release ZIPs
        uses: actions/download-artifact@v8
        with:
          name: release-windows-x64-msvc-attempt-${{ needs.rust-validation-report.outputs.windows-artifact-attempt }}
          path: dist
      - name: Check immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Check source identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.rust-validation-report.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Verify ZIPs and create outer checksums
        run: |
          python3 .github/scripts/release/release_package.py downloaders --output dist
          python3 .github/scripts/release/release_package.py checksums --output dist
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Attest verified release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/agent-work-kit-v${{ needs.rust-validation-report.outputs.version }}-codex-macos-arm64.zip
            dist/agent-work-kit-v${{ needs.rust-validation-report.outputs.version }}-claude-macos-arm64.zip
            dist/agent-work-kit-v${{ needs.rust-validation-report.outputs.version }}-codex-windows-x64-msvc.zip
            dist/agent-work-kit-v${{ needs.rust-validation-report.outputs.version }}-claude-windows-x64-msvc.zip
            dist/install-agent-work-kit-from-github-release.command
            dist/install-agent-work-kit-from-github-release.bat
            dist/SHA256SUMS.txt
      - name: Verify all seven build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.rust-validation-report.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for asset in dist/*.zip dist/*.command dist/*.bat dist/SHA256SUMS.txt; do
            gh attestation verify "$asset" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/publish-release.yml" --source-ref "refs/heads/main" --source-digest "$EXPECTED_SHA"
          done
      - name: Record signed asset manifest digest
        id: digest
        run: echo "manifest_sha256=$(sha256sum dist/SHA256SUMS.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-assets-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Record signed asset attempt
        id: artifact-attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  prepare-and-publish-release:
    name: prepare and publish release
    needs: verify-and-attest-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      tag: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
      version: ${{ needs.verify-and-attest-release-assets.outputs.version }}
      manifest_sha256: ${{ needs.verify-and-attest-release-assets.outputs.manifest_sha256 }}
      artifact-attempt: ${{ needs.verify-and-attest-release-assets.outputs.artifact-attempt }}
    steps:
      - name: Check out source for release publication
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets-attempt-${{ needs.verify-and-attest-release-assets.outputs.artifact-attempt }}
          path: dist
      - name: Download validated release content
        uses: actions/download-artifact@v8
        with:
          name: validated-release-content-attempt-${{ needs.verify-and-attest-release-assets.outputs.release-content-artifact-attempt }}
      - name: Recheck signed asset bytes and identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.verify-and-attest-release-assets.outputs.manifest_sha256 }}
        run: |
          echo "$MANIFEST_SHA256  dist/SHA256SUMS.txt" | sha256sum --check
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
          for asset in dist/*.zip dist/*.command dist/*.bat dist/SHA256SUMS.txt; do
            gh attestation verify "$asset" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/publish-release.yml" --source-ref "refs/heads/main" --source-digest "$EXPECTED_SHA"
          done
      - name: Verify prepared release content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py verify-content --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --notes-file release-notes.md --title-file release-title.txt --manifest-file release-content.json
      - name: Check immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Create draft with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_draft_creation.py --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --directory dist --title-file release-title.txt --notes-file release-notes.md
      - name: Verify draft and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/release/release_publication_checks.py assets-draft --repository "$REPOSITORY" --tag "$TAG" --directory dist --title-file release-title.txt --notes-file release-notes.md
          python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Recheck immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
      - name: Verify published release content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
        run: python3 .github/scripts/release/release_publication_checks.py assets-published --repository "$REPOSITORY" --tag "$TAG" --directory dist --title-file release-title.txt --notes-file release-notes.md

  verify-published-release:
    name: verify published release
    if: always()
    needs: prepare-and-publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Check out source for published release verification
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download signed assets for published release verification
        uses: actions/download-artifact@v8
        if: always()
        continue-on-error: true
        with:
          name: signed-release-assets-attempt-${{ needs.prepare-and-publish-release.outputs.artifact-attempt }}
          path: dist
      - name: Verify downloaded published assets
        id: verify-published
        if: needs.prepare-and-publish-release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare-and-publish-release.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.prepare-and-publish-release.outputs.manifest_sha256 }}
        run: |
          python3 .github/scripts/release/release_post_publish_checks.py --version "${TAG#v}" --repository "$REPOSITORY" --tag "$TAG" --commit "$EXPECTED_SHA" --manifest-sha256 "$MANIFEST_SHA256" --expected-dir dist --actual-dir published --output release-checks.json
      - name: Write release verification report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare-and-publish-release.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLISH_STATUS: ${{ needs.prepare-and-publish-release.result }}
          VERIFY_STATUS: ${{ steps.verify-published.outcome || 'skipped' }}
        run: |
          python3 .github/scripts/release/release_verification_report.py --version "${VERSION:-$(cat VERSION)}" --commit "$EXPECTED_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --repository "$REPOSITORY" --run-id "$GITHUB_RUN_ID" --expected-dir dist --actual-dir published --checks release-checks.json --output release-verification.json --publish-status "$PUBLISH_STATUS" --post-publish-verify-status "$VERIFY_STATUS"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ needs.prepare-and-publish-release.outputs.tag || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            release-verification.json
            release-checks.json
          if-no-files-found: error
