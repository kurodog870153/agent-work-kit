name: publish release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: work-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-ci:
    name: rust validation
    uses: ./.github/workflows/rust-validation.yml
    permissions:
      contents: read
      actions: read

  create-release-tag:
    name: create release tag
    needs: rust-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create version tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_tag_creation.py --repository "$REPOSITORY" --expected-sha "$EXPECTED_SHA"

  validate-release-publication:
    name: validate release publication
    needs: create-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ needs.create-release-tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject rerun or reused release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.create-release-tag.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py first-attempt --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Validate tag, commit, version and lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.create-release-tag.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Record version
        id: version
        env:
          TAG: ${{ needs.create-release-tag.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-and-test-macos-zip:
    name: build and test macOS release ZIP
    needs: validate-release-publication
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.validate-release-publication.outputs.tag }}
      version: ${{ needs.validate-release-publication.outputs.version }}
    env:
      TAG: ${{ needs.validate-release-publication.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        uses: ./.github/actions/select-release-rust-toolchain
        with:
          target: aarch64-apple-darwin
      - name: Require native ARM64 runner
        run: test "$(uname -m)" = arm64 && test "$RUNNER_ARCH" = ARM64
      - name: Verify macOS downloader against loopback fixture
        run: python3 -B .github/scripts/tests/release/mac/downloader/test_entry.py
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN"
      - name: Build native release binary
        working-directory: rust
        run: |
          cargo build --release --locked -p work-cli
          cargo build --release --locked -p tooling-cli
      - name: Package and verify final macOS ZIP
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/release/release_package.py package --output dist --platform macos-arm64 --binary rust/target/release/work --tooling-binary rust/target/release/tooling --commit "$COMMIT" --runner-label macos-latest --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --runner-image "${ImageOS:?missing runner image}" --runner-image-version "${ImageVersion:?missing runner image version}" --os-name "$(sw_vers -productName)" --os-version "$(sw_vers -productVersion)" --os-build "$(sw_vers -buildVersion)"
          python3 .github/scripts/release/release_package_integrity.py verify-zip "dist/work-v${TAG#v}-macos-arm64.zip"
          (cd dist && shasum -a 256 "work-v${TAG#v}-macos-arm64.zip" > SHA256SUMS.txt)
          python3 -B .github/scripts/release/release_downloader_e2e.py --zip "dist/work-v${TAG#v}-macos-arm64.zip" --checksums dist/SHA256SUMS.txt --platform macos-arm64
          sandbox-exec -p '(version 1)(allow default)(deny network*)' python3 .github/scripts/release/release_install_e2e.py --zip "dist/work-v${TAG#v}-macos-arm64.zip" --checksums dist/SHA256SUMS.txt --platform macos-arm64 --source-install
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: checksums-release-macos-arm64
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  build-and-test-windows-zip:
    name: build and test Windows release ZIP
    needs: validate-release-publication
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.validate-release-publication.outputs.tag }}
      version: ${{ needs.validate-release-publication.outputs.version }}
    env:
      TAG: ${{ needs.validate-release-publication.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        uses: ./.github/actions/select-release-rust-toolchain
        with:
          target: x86_64-pc-windows-msvc
      - name: Require native x64 runner
        run: |
          if ($env:RUNNER_ARCH -ne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected Windows x64 runner' }
      - name: Verify Windows downloader against loopback fixture
        run: python -B .github/scripts/tests/release/windows/downloader/test_entry.py
      - name: Verify batch line endings
        uses: ./.github/actions/verify-windows-batch-line-endings
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN
      - name: Build native release binary
        working-directory: rust
        run: |
          cargo build --release --locked -p work-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p tooling-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify final Windows ZIP
        env:
          COMMIT: ${{ github.sha }}
        run: |
          $version = $env:TAG.Substring(1)
          $os = Get-CimInstance Win32_OperatingSystem
          python -B .github/scripts/release/release_package.py package --output dist --platform windows-x64-msvc --binary rust/target/release/work.exe --tooling-binary rust/target/release/tooling.exe --commit $env:COMMIT --runner-label windows-latest --runner-os $env:RUNNER_OS --runner-arch $env:RUNNER_ARCH --runner-image $env:ImageOS --runner-image-version $env:ImageVersion --os-name $os.Caption --os-version $os.Version --os-build $os.BuildNumber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "dist/work-v${version}-windows-x64-msvc.zip"
          python -B .github/scripts/release/release_package_integrity.py verify-zip $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), "$hash  $(Split-Path $zip -Leaf)`n")
          python -B .github/scripts/release/release_downloader_e2e.py --zip $zip --checksums dist/SHA256SUMS.txt --platform windows-x64-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows release installation and restore artifact network
        uses: ./.github/actions/verify-windows-release-install
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-msvc
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: checksums-release-windows-x64-msvc
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  verify-macos-release-package-checksums:
    name: verify macOS release package checksums
    needs: build-and-test-macos-zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ needs.build-and-test-macos-zip.outputs.tag }}
      version: ${{ needs.build-and-test-macos-zip.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release-package-checksums
        with:
          platform: macos-arm64
          package-artifact: release-macos-arm64
          checksum-artifact: checksums-release-macos-arm64

  verify-windows-release-package-checksums:
    name: verify Windows release package checksums
    needs: build-and-test-windows-zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release-package-checksums
        with:
          platform: windows-x64-msvc
          package-artifact: release-windows-x64-msvc
          checksum-artifact: checksums-release-windows-x64-msvc

  verify-and-attest-release-assets:
    name: verify and attest release assets
    needs: [verify-macos-release-package-checksums, verify-windows-release-package-checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ needs.verify-macos-release-package-checksums.outputs.tag }}
      version: ${{ needs.verify-macos-release-package-checksums.outputs.version }}
      manifest_sha256: ${{ steps.digest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Check source identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-macos-release-package-checksums.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Verify ZIPs and create outer checksums
        run: |
          python3 .github/scripts/release/release_package.py downloaders --output dist
          python3 .github/scripts/release/release_package.py checksums --output dist
          cd dist
          sha256sum --check SHA256SUMS.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/work-v${{ needs.verify-macos-release-package-checksums.outputs.version }}-macos-arm64.zip
            dist/work-v${{ needs.verify-macos-release-package-checksums.outputs.version }}-windows-x64-msvc.zip
            dist/install-work-from-github-release.command
            dist/install-work-from-github-release.bat
            dist/SHA256SUMS.txt
      - name: Verify all five build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-macos-release-package-checksums.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for asset in dist/*.zip dist/*.command dist/*.bat dist/SHA256SUMS.txt; do
            gh attestation verify "$asset" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/publish-release.yml" --source-ref "refs/heads/main" --source-digest "$EXPECTED_SHA"
          done
      - name: Record signed asset manifest digest
        id: digest
        run: echo "manifest_sha256=$(sha256sum dist/SHA256SUMS.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-assets
          path: dist/
          if-no-files-found: error

  prepare-and-publish-release:
    name: prepare and publish release
    needs: verify-and-attest-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      tag: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
      version: ${{ needs.verify-and-attest-release-assets.outputs.version }}
      manifest_sha256: ${{ needs.verify-and-attest-release-assets.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: dist
      - name: Recheck signed asset bytes and identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.verify-and-attest-release-assets.outputs.manifest_sha256 }}
        run: |
          echo "$MANIFEST_SHA256  dist/SHA256SUMS.txt" | sha256sum --check
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
          for asset in dist/*.zip dist/*.command dist/*.bat dist/SHA256SUMS.txt; do
            gh attestation verify "$asset" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/publish-release.yml" --source-ref "refs/heads/main" --source-digest "$EXPECTED_SHA"
          done
      - name: Verify and prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release/release_publication_checks.py notes --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA" --notes-file release-notes.md
      - name: Check immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Create draft with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip dist/*.command dist/*.bat dist/SHA256SUMS.txt --repo "$REPOSITORY" --draft --verify-tag --notes-file release-notes.md
      - name: Verify draft and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/release/release_publication_checks.py assets-draft --repository "$REPOSITORY" --tag "$TAG" --directory dist
          python3 .github/scripts/release/release_publication_checks.py identity --repository "$REPOSITORY" --tag "$TAG" --expected-sha "$EXPECTED_SHA"
      - name: Recheck immutable releases setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/release_publication_checks.py immutable --repository "$REPOSITORY"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify-and-attest-release-assets.outputs.tag }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false

  verify-published-release:
    name: verify published release
    if: always()
    needs: prepare-and-publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: always()
        continue-on-error: true
        with:
          name: signed-release-assets
          path: dist
      - name: Verify downloaded published assets
        id: verify-published
        if: needs.prepare-and-publish-release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare-and-publish-release.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.prepare-and-publish-release.outputs.manifest_sha256 }}
        run: |
          python3 .github/scripts/release/release_post_publish_checks.py --version "${TAG#v}" --repository "$REPOSITORY" --tag "$TAG" --commit "$EXPECTED_SHA" --manifest-sha256 "$MANIFEST_SHA256" --expected-dir dist --actual-dir published --output release-checks.json
      - name: Write release verification report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare-and-publish-release.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLISH_STATUS: ${{ needs.prepare-and-publish-release.result }}
          VERIFY_STATUS: ${{ steps.verify-published.outcome || 'skipped' }}
        run: |
          python3 .github/scripts/release/release_verification_report.py --version "${VERSION:-$(cat VERSION)}" --commit "$EXPECTED_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --repository "$REPOSITORY" --run-id "$GITHUB_RUN_ID" --expected-dir dist --actual-dir published --checks release-checks.json --output release-verification.json --publish-status "$PUBLISH_STATUS" --post-publish-verify-status "$VERIFY_STATUS"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ needs.prepare-and-publish-release.outputs.tag || github.sha }}
          path: |
            release-verification.json
            release-checks.json
          if-no-files-found: error
