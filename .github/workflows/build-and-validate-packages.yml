name: build and validate packages

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.verify-windows-release-package-checksums.outputs.tag }}
      version:
        value: ${{ jobs.verify-windows-release-package-checksums.outputs.version }}
      macos-artifact-attempt:
        value: ${{ jobs.verify-macos-release-package-checksums.outputs.artifact-attempt }}
      windows-artifact-attempt:
        value: ${{ jobs.verify-windows-release-package-checksums.outputs.artifact-attempt }}
    inputs:
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-and-verify-macos-package:
    name: build macOS package
    runs-on: macos-latest
    outputs:
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_MODE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        uses: ./.github/actions/select-release-rust-toolchain
        with:
          target: aarch64-apple-darwin
      - name: Require native ARM64 runner
        run: test "$(uname -m)" = arm64 && test "$RUNNER_ARCH" = ARM64
      - name: Verify macOS installer prerequisites
        run: |
          if [[ "$RELEASE_MODE" == false ]]; then
            bash .github/scripts/tests/release/mac/lock/test_native_lock.sh
            bash .github/scripts/tests/release/mac/cli/test_parse_options.sh
            node .github/scripts/tests/release/mac/state/test_install_state.js
            bash .github/scripts/tests/release/mac/transaction/test_work.sh
            bash .github/scripts/tests/release/mac/transaction/test_tooling.sh
            bash .github/scripts/tests/release/mac/global-instructions/test_policy.sh
            bash .github/scripts/tests/release/mac/global-instructions/test_transaction.sh
          fi
          python3 -B .github/scripts/tests/release/test_downloader_entry.py
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN"
      - name: Build native release binary
        working-directory: rust
        run: |
          cargo build --release --locked -p work-cli
          cargo build --release --locked -p tooling-cli
      - name: Package and verify macOS ZIP
        run: |
          if [[ "$RELEASE_MODE" == false ]]; then
            bash .github/scripts/tests/release/mac/target/test_preflight.sh
            bash .github/scripts/tests/release/mac/install/test_install.sh
            version="$(cat VERSION)"
          else
            version="${TAG#v}"
          fi
          for host in codex claude; do
            zip="dist/agent-work-kit-v${version}-${host}-macos-arm64.zip"
            python3 .github/scripts/release/release_package.py package --output dist --host "$host" --platform macos-arm64 --binary rust/target/release/work --tooling-binary rust/target/release/tooling --commit "$GITHUB_SHA" --runner-label macos-latest --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --runner-image "${ImageOS:?missing runner image}" --runner-image-version "${ImageVersion:?missing runner image version}" --os-name "$(sw_vers -productName)" --os-version "$(sw_vers -productVersion)" --os-build "$(sw_vers -buildVersion)"
            python3 .github/scripts/release/release_package_integrity.py verify-zip "$zip"
            (cd dist && shasum -a 256 "${zip##*/}") >> dist/SHA256SUMS.txt
          done
          for host in codex claude; do
            zip="dist/agent-work-kit-v${version}-${host}-macos-arm64.zip"
            python3 -B .github/scripts/release/release_downloader_e2e.py --zip "$zip" --checksums dist/SHA256SUMS.txt --platform macos-arm64
          done
      - name: Verify macOS release installation
        run: bash .github/scripts/release/mac/verify_install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('release-macos-arm64-attempt-{0}', github.run_attempt) || 'pr-release-macos-arm64' }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('checksums-release-macos-arm64-attempt-{0}', github.run_attempt) || 'checksums-pr-release-macos-arm64' }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Record artifact attempt
        id: artifact-attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  build-and-verify-windows-package:
    name: build Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_MODE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: ${{ inputs.release && '0' || '1' }}
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Select Rust toolchain
        uses: ./.github/actions/select-release-rust-toolchain
        with:
          target: x86_64-pc-windows-msvc
      - name: Require native x64 runner
        run: |
          if ($env:RUNNER_ARCH -ne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected Windows x64 runner' }
      - name: Verify Windows installer prerequisites
        run: |
          if ($env:RELEASE_MODE -eq 'false') {
            powershell.exe -NoProfile -File .github/scripts/tests/release/windows/lock/test_mutex.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B .github/scripts/tests/release/test_downloader_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_MODE -eq 'false') {
            python -B .github/scripts/tests/release/test_release_install_e2e.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File .github/scripts/tests/release/windows/test_firewall_isolation.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($env:RELEASE_MODE -eq 'false') {
            foreach ($test in @(
              'cli/test_parse_options.ps1', 'state/test_install_state.ps1',
              'transaction/test_work.ps1', 'transaction/test_tooling.ps1',
              'global-instructions/test_policy.ps1', 'global-instructions/test_transaction.ps1'
            )) {
              powershell.exe -NoProfile -File ".github/scripts/tests/release/windows/$test"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Verify batch line endings
        uses: ./.github/actions/verify-windows-batch-line-endings
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN
      - name: Build native release binary
        working-directory: rust
        run: |
          cargo build --release --locked -p work-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p tooling-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify Windows ZIP
        run: |
          if ($env:RELEASE_MODE -eq 'false') {
            powershell.exe -NoProfile -File .github/scripts/tests/release/windows/target/test_preflight.ps1 -Binary rust/target/release/work.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            powershell.exe -NoProfile -File .github/scripts/tests/release/windows/install/test_install.ps1 -Binary rust/target/release/work.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            powershell.exe -NoProfile -File .github/scripts/tests/release/windows/package/test_entry.ps1 -Binary rust/target/release/work.exe -ToolingBinary rust/target/release/tooling.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = (Get-Content VERSION -Raw).Trim()
          } else {
            $version = $env:TAG.Substring(1)
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $checksumLines = @()
          foreach ($installerHost in @('codex', 'claude')) {
            python -B .github/scripts/release/release_package.py package --output dist --host $installerHost --platform windows-x64-msvc --binary rust/target/release/work.exe --tooling-binary rust/target/release/tooling.exe --commit $env:GITHUB_SHA --runner-label windows-latest --runner-os $env:RUNNER_OS --runner-arch $env:RUNNER_ARCH --runner-image $env:ImageOS --runner-image-version $env:ImageVersion --os-name $os.Caption --os-version $os.Version --os-build $os.BuildNumber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $zip = "dist/agent-work-kit-v${version}-${installerHost}-windows-x64-msvc.zip"
            python -B .github/scripts/release/release_package_integrity.py verify-zip $zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLines += "$hash  $(Split-Path $zip -Leaf)"
          }
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), (($checksumLines -join "`n") + "`n"))
          foreach ($installerHost in @('codex', 'claude')) {
            $zip = "dist/agent-work-kit-v${version}-${installerHost}-windows-x64-msvc.zip"
            python -B .github/scripts/release/release_downloader_e2e.py --zip $zip --checksums dist/SHA256SUMS.txt --platform windows-x64-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify Windows release installation
        run: pwsh -NoProfile -File .github/scripts/release/windows/verify_install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('release-windows-x64-msvc-attempt-{0}', github.run_attempt) || 'pr-release-windows-x64-msvc' }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('checksums-release-windows-x64-msvc-attempt-{0}', github.run_attempt) || 'checksums-pr-release-windows-x64-msvc' }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Record artifact attempt
        id: artifact-attempt
        shell: bash
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  verify-macos-release-package-checksums:
    name: verify macOS checksums
    needs: build-and-verify-macos-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ needs.build-and-verify-macos-package.outputs.artifact-attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release-package-checksums
        with:
          platform: macos-arm64
          package-artifact: ${{ inputs.release && format('release-macos-arm64-attempt-{0}', needs.build-and-verify-macos-package.outputs.artifact-attempt) || 'pr-release-macos-arm64' }}
          checksum-artifact: ${{ inputs.release && format('checksums-release-macos-arm64-attempt-{0}', needs.build-and-verify-macos-package.outputs.artifact-attempt) || 'checksums-pr-release-macos-arm64' }}

  verify-windows-release-package-checksums:
    name: verify Windows checksums
    needs: build-and-verify-windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      artifact-attempt: ${{ needs.build-and-verify-windows-package.outputs.artifact-attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release-package-checksums
        with:
          platform: windows-x64-msvc
          package-artifact: ${{ inputs.release && format('release-windows-x64-msvc-attempt-{0}', needs.build-and-verify-windows-package.outputs.artifact-attempt) || 'pr-release-windows-x64-msvc' }}
          checksum-artifact: ${{ inputs.release && format('checksums-release-windows-x64-msvc-attempt-{0}', needs.build-and-verify-windows-package.outputs.artifact-attempt) || 'checksums-pr-release-windows-x64-msvc' }}
      - name: Record verified package identity
        id: identity
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

