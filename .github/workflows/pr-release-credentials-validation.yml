name: pr release credentials validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-release-credentials-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-credentials:
    name: validate release credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check release admin token and immutable releases
        id: credentials
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "CREDENTIALS_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          state=failure
          if [[ -z "$RELEASE_ADMIN_TOKEN" ]]; then
            echo 'RELEASE_ADMIN_READ_TOKEN is missing'
          elif enabled="$(GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "repos/$REPOSITORY/immutable-releases" --jq '.enabled' 2>/dev/null)"; then
            if [[ "$enabled" == true ]]; then
              state=success
            else
              echo 'Immutable releases are not enabled'
            fi
          else
            echo 'RELEASE_ADMIN_READ_TOKEN is expired, invalid, or lacks Administration read permission'
          fi
          if [[ "$state" != success ]]; then
            exit 1
          fi

      - name: Generate workflow summary
        if: always()
        continue-on-error: true
        env:
          CREDENTIALS_RESULT: ${{ steps.credentials.outcome }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          renderer="$RUNNER_TEMP/workflow_summary.py"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$WORKFLOW_SHA/.github/scripts/ci/workflow_summary.py" -o "$renderer"
          python3 -B "$renderer" credentials
