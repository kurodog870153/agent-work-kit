name: pr release credentials validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  validate-release-credentials:
    name: validate release credentials
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Check release admin token and immutable releases
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid pull request head SHA'
            exit 1
          fi
          state=failure
          if [[ -z "$RELEASE_ADMIN_TOKEN" ]]; then
            echo 'RELEASE_ADMIN_READ_TOKEN is missing'
          elif enabled="$(GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "repos/$REPOSITORY/immutable-releases" --jq '.enabled' 2>/dev/null)"; then
            if [[ "$enabled" == true ]]; then
              state=success
            else
              echo 'Immutable releases are not enabled'
            fi
          else
            echo 'RELEASE_ADMIN_READ_TOKEN is expired, invalid, or lacks Administration read permission'
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=work-release-credentials \
            -f description='Release admin token and immutable releases readiness' \
            -f target_url="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          if [[ "$state" != success ]]; then
            exit 1
          fi
