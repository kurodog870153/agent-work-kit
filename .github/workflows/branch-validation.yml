name: branch validation
run-name: 'branch validation: ${{ github.ref_name }}'

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: validate branch preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shared validation preflight
        uses: ./.github/actions/validation-preflight

  rust-ci:
    name: rust validation
    needs: preflight
    uses: ./.github/workflows/rust-validation.yml
    permissions:
      contents: read
      actions: read

  package-ci:
    name: build and validate packages
    needs: preflight
    uses: ./.github/workflows/build-and-validate-packages.yml
    permissions:
      contents: read
      actions: read

  rust-validation-evidence:
    name: rust validation evidence
    needs: [rust-ci, package-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source for rust validation evidence
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Rust and installed Host evidence
        uses: ./.github/actions/rust-validation-evidence
        with:
          macos-artifact-attempt: ${{ needs.package-ci.outputs.macos-artifact-attempt }}
          windows-artifact-attempt: ${{ needs.package-ci.outputs.windows-artifact-attempt }}
          macos-rust-attempt: ${{ needs.rust-ci.outputs.macos-rust-attempt }}
          windows-rust-attempt: ${{ needs.rust-ci.outputs.windows-rust-attempt }}

  confirm-branch-validation:
    name: confirm branch validation
    if: always()
    needs: rust-validation-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust workspace evidence to pass
        env:
          EVIDENCE_VALIDATION: ${{ needs.rust-validation-evidence.result }}
        run: |
          if [[ "$EVIDENCE_VALIDATION" != success ]]; then
            echo "Rust workspace evidence did not pass: $EVIDENCE_VALIDATION"
            exit 1
          fi

  generate-workflow-summary:
    name: generate workflow summary
    if: always()
    needs: confirm-branch-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    continue-on-error: true
    steps:
      - name: Check out source for workflow summary
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci/workflow_summary.py branch
