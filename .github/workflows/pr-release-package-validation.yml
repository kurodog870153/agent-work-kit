name: pr release package validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-release-preflight:
    name: validate release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
      - name: Check approved workflow actions
        run: python3 -B .github/scripts/release/check_workflow_actions.py
      - name: Test release scripts
        run: python3 -B -m unittest discover -s .github/scripts/tests/release -p 'test_*.py'
      - name: Check proposed release version is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release/release_version_availability.py

  build-and-verify-macos-package:
    name: build and verify macOS package
    needs: validate-release-preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require native ARM64 runner
        run: test "$(uname -m)" = arm64 && test "$RUNNER_ARCH" = ARM64
      - name: Install Rust toolchain
        run: rustup toolchain install 1.85.0-aarch64-apple-darwin
      - name: Build native release binary
        working-directory: rust
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-aarch64-apple-darwin
        run: cargo build --release --locked -p work-cli --target aarch64-apple-darwin
      - name: Package and verify macOS ZIP
        run: |
          python3 .github/scripts/release/release_package.py package --output dist --platform macos-arm64 --binary rust/target/aarch64-apple-darwin/release/work --commit "$GITHUB_SHA" --runner-label macos-latest --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --runner-image "${ImageOS:?missing runner image}" --runner-image-version "${ImageVersion:?missing runner image version}" --os-name "$(sw_vers -productName)" --os-version "$(sw_vers -productVersion)" --os-build "$(sw_vers -buildVersion)"
          (cd dist && shasum -a 256 "work-v$(cat ../VERSION)-macos-arm64.zip" > SHA256SUMS.txt)
          sandbox-exec -p '(version 1)(allow default)(deny network*)' python3 .github/scripts/release/release_install_e2e.py --zip "dist/work-v$(cat VERSION)-macos-arm64.zip" --checksums dist/SHA256SUMS.txt --platform macos-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: pr-release-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  build-and-verify-windows-package:
    name: build and verify Windows package
    needs: validate-release-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Require native x64 runner
        run: |
          if ($env:RUNNER_ARCH -ne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected Windows x64 runner' }
      - name: Verify batch line endings
        run: |
          foreach ($path in @('os-scripts/windows/install-release.bat', 'os-scripts/windows/installer/global-agents.bat', 'os-scripts/windows/installer/work-core.bat')) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/crlf\s') { throw "Checkout changed batch line endings for ${path}: $entry" }
          }
      - name: Install Rust toolchain
        run: rustup toolchain install 1.85.0-x86_64-pc-windows-msvc
      - name: Build native release binary
        working-directory: rust
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
        run: cargo build --release --locked -p work-cli --target x86_64-pc-windows-msvc
      - name: Package and verify Windows ZIP
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $os = Get-CimInstance Win32_OperatingSystem
          python -B .github/scripts/release/release_package.py package --output dist --platform windows-x64-msvc --binary rust/target/x86_64-pc-windows-msvc/release/work.exe --commit $env:GITHUB_SHA --runner-label windows-latest --runner-os $env:RUNNER_OS --runner-arch $env:RUNNER_ARCH --runner-image $env:ImageOS --runner-image-version $env:ImageVersion --os-name $os.Caption --os-version $os.Version --os-build $os.BuildNumber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "work-v${version}-windows-x64-msvc.zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), "$hash  $zip`n")
          $rule = "work-release-e2e-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-NetFirewallRule -Name $rule -DisplayName $rule -Direction Outbound -Action Block -Profile Any -Enabled True -ErrorAction Stop | Out-Null
          try {
            $active = Get-NetFirewallRule -Name $rule -ErrorAction Stop
            if ($active.Enabled -ne 'True' -or $active.Action -ne 'Block') { throw 'Network isolation rule is inactive' }
            python -B .github/scripts/release/release_install_e2e.py --zip "dist/$zip" --checksums dist/SHA256SUMS.txt --platform windows-x64-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -Name $rule -ErrorAction Stop
          }
      - uses: actions/upload-artifact@v6
        with:
          name: pr-release-windows-x64-msvc
          path: dist/*.zip
          if-no-files-found: error

  verify-release-package-checksums:
    name: verify release package checksums
    needs: [build-and-verify-macos-package, build-and-verify-windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pr-release-*
          path: dist
          merge-multiple: true
      - name: Verify both ZIPs and outer checksums
        run: |
          python3 .github/scripts/release/release_package.py checksums --output dist
          cd dist
          sha256sum --check SHA256SUMS.txt

  confirm-release-validation:
    name: confirm release validation
    if: always()
    needs: [validate-release-preflight, build-and-verify-macos-package, build-and-verify-windows-package, verify-release-package-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to pass
        env:
          PREFLIGHT: ${{ needs.validate-release-preflight.result }}
          MACOS: ${{ needs.build-and-verify-macos-package.result }}
          WINDOWS: ${{ needs.build-and-verify-windows-package.result }}
          CHECKSUMS: ${{ needs.verify-release-package-checksums.result }}
        run: |
          for result in "$PREFLIGHT" "$MACOS" "$WINDOWS" "$CHECKSUMS"; do
            if [[ "$result" != success ]]; then
              echo "A release check did not pass: $result"
              exit 1
            fi
          done
