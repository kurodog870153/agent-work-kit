name: Validate PR release packages

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-workflows-scripts-and-version:
    name: Validate workflows, release scripts and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.parse_file(path) }'
      - name: Test release scripts
        run: python3 -B -m unittest discover -s .github/scripts/release -p 'test_*.py'
      - name: Check proposed release version is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release/release_version_availability.py

  build-and-verify-macos-package:
    name: Build and verify macOS ARM64 release package
    needs: validate-workflows-scripts-and-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require native ARM64 runner
        run: test "$(uname -m)" = arm64 && test "$RUNNER_ARCH" = ARM64
      - name: Install Rust toolchain
        run: rustup toolchain install 1.85.0-aarch64-apple-darwin
      - name: Build native release binary
        working-directory: rust
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-aarch64-apple-darwin
        run: cargo build --release --locked -p work-cli --target aarch64-apple-darwin
      - name: Package and verify macOS ZIP
        run: |
          python3 .github/scripts/release/release_package.py package --output dist --platform macos-arm64 --binary rust/target/aarch64-apple-darwin/release/work --commit "$GITHUB_SHA" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --runner-image "${ImageOS:-unknown}" --os-version "$(sw_vers -productVersion)"
          python3 .github/scripts/release/release_install_e2e.py --zip "dist/work-v$(cat VERSION)-macos-arm64.zip" --platform macos-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: pr-release-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  build-and-verify-windows-package:
    name: Build and verify Windows x64 release package
    needs: validate-workflows-scripts-and-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Require native x64 runner
        run: |
          if ($env:RUNNER_ARCH -ne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected Windows x64 runner' }
      - name: Verify batch line endings
        run: |
          foreach ($path in @('os-scripts/windows/install-release.bat', 'os-scripts/windows/installer/global-agents.bat', 'os-scripts/windows/installer/work-core.bat')) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/crlf\s') { throw "Checkout changed batch line endings for ${path}: $entry" }
          }
      - name: Install Rust toolchain
        run: rustup toolchain install 1.85.0-x86_64-pc-windows-msvc
      - name: Build native release binary
        working-directory: rust
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
        run: cargo build --release --locked -p work-cli --target x86_64-pc-windows-msvc
      - name: Package and verify Windows ZIP
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $osVersion = (Get-CimInstance Win32_OperatingSystem).Version
          python -B .github/scripts/release/release_package.py package --output dist --platform windows-x64-msvc --binary rust/target/x86_64-pc-windows-msvc/release/work.exe --commit $env:GITHUB_SHA --runner-os $env:RUNNER_OS --runner-arch $env:RUNNER_ARCH --runner-image $env:ImageOS --os-version $osVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/scripts/release/release_install_e2e.py --zip "dist/work-v${version}-windows-x64-msvc.zip" --platform windows-x64-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: pr-release-windows-x64-msvc
          path: dist/*.zip
          if-no-files-found: error

  verify-package-checksums:
    name: Verify release package checksums
    needs: [build-and-verify-macos-package, build-and-verify-windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pr-release-*
          path: dist
          merge-multiple: true
      - name: Verify both ZIPs and outer checksums
        run: |
          python3 .github/scripts/release/release_package.py checksums --output dist
          cd dist
          sha256sum --check SHA256SUMS.txt

  confirm-all-release-checks-passed:
    name: Confirm all PR release checks passed
    if: always()
    needs: [validate-workflows-scripts-and-version, build-and-verify-macos-package, build-and-verify-windows-package, verify-package-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to pass
        env:
          PREFLIGHT: ${{ needs.validate-workflows-scripts-and-version.result }}
          MACOS: ${{ needs.build-and-verify-macos-package.result }}
          WINDOWS: ${{ needs.build-and-verify-windows-package.result }}
          CHECKSUMS: ${{ needs.verify-package-checksums.result }}
        run: |
          for result in "$PREFLIGHT" "$MACOS" "$WINDOWS" "$CHECKSUMS"; do
            if [[ "$result" != success ]]; then
              echo "A release check did not pass: $result"
              exit 1
            fi
          done
