name: rust validation

on:
  workflow_call:
    outputs:
      macos-rust-attempt:
        value: ${{ jobs.validate-and-build-rust-macos.outputs.artifact-attempt }}
      windows-rust-attempt:
        value: ${{ jobs.validate-and-build-rust-windows.outputs.artifact-attempt }}

jobs:
  validate-and-build-rust-macos:
    name: validate and build rust (macOS)
    runs-on: macos-latest
    outputs:
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: rust
    steps:
      - &rust_checkout
        name: Check out source for Rust validation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Set up Python for CI tests
        uses: ./.github/actions/setup-rust-validation-python
      - name: Select Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(python3 -B ../.github/scripts/release/rust_toolchain.py)" >> "$GITHUB_ENV"
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: python3 -B .github/scripts/ci/check_checkout_line_endings.py
      - name: Test CI scripts
        run: |
          python3 -B -m unittest discover -s ../.github/scripts/tests/ci -p 'test_*.py'
      - name: Set up Rust toolchain
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py setup
      - &install_nextest
        name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: python3 -B ../.github/scripts/ci/rust_test_results.py environment --directory .ci-results --platform macos-arm64 --target native
      - name: Record artifact attempt
        id: artifact-attempt
        shell: bash
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile Rust tests
        id: mac_test_compile
        continue-on-error: true
        run: python3 ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase compile -- cargo test --workspace --locked --no-run
      - name: Run Rust unit and integration tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast
      - name: Run Rust doc tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase doc -- cargo test --workspace --locked --doc
      - name: Collect Rust test results
        if: always()
        run: python3 ../.github/scripts/ci/rust_test_results.py report --directory .ci-results --junit target/nextest/ci/junit.xml --output .ci-results/test-results.json --platform macos-arm64 --target native --min-doc-tests 1
      - name: Upload Rust test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-results-macos-arm64-attempt-${{ github.run_attempt }}
          path: |
            rust/.ci-results/*.json
            rust/.ci-results/doc.log
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce Rust test results
        if: always()
        run: python3 ../.github/scripts/ci/rust_test_results.py enforce --directory .ci-results --junit target/nextest/ci/junit.xml --min-doc-tests 1
      - name: Build Work and Skill release binaries
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py build
      - name: Smoke test Rust binaries
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py smoke
      - name: Simulate Host behaviour with the release binaries
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py simulation
      - name: Upload Host simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-binary-host-simulation-macos-arm64-attempt-${{ github.run_attempt }}
          path: rust/.ci-results/binary-host-simulation.json
          if-no-files-found: warn

  validate-and-build-rust-windows:
    name: validate and build rust (Windows)
    runs-on: windows-latest
    outputs:
      artifact-attempt: ${{ steps.artifact-attempt.outputs.value }}
    permissions:
      contents: read
      actions: read
    env:
      WORK_RUST_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: rust
    steps:
      - *rust_checkout
      - name: Set up Python for CI tests
        uses: ./.github/actions/setup-rust-validation-python
      - name: Select Rust toolchain
        run: |
          $toolchain = python -B ../.github/scripts/release/rust_toolchain.py --target $env:WORK_RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: python -B .github/scripts/ci/check_checkout_line_endings.py
      - name: Test CI scripts
        run: |
          python -B -m unittest discover -s ../.github/scripts/tests/ci -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Rust toolchain
        run: python -B ../.github/scripts/ci/rust_validation_steps.py setup
      - *install_nextest
      - name: Record runner environment
        run: python -B ../.github/scripts/ci/rust_test_results.py environment --directory .ci-results --platform windows-x64-msvc --target $env:WORK_RUST_TARGET
      - name: Record artifact attempt
        id: artifact-attempt
        shell: bash
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked --target $env:WORK_RUST_TARGET
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked --target $env:WORK_RUST_TARGET -- -D warnings
      - name: Compile Rust tests
        id: windows_test_compile
        continue-on-error: true
        run: python ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase compile -- cargo test --workspace --locked --no-run --target $env:WORK_RUST_TARGET
      - name: Run Rust unit and integration tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast --target $env:WORK_RUST_TARGET
      - name: Run Rust doc tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci/rust_test_results.py measure --directory .ci-results --phase doc -- cargo test --workspace --locked --doc --target $env:WORK_RUST_TARGET
      - name: Collect Rust test results
        if: always()
        run: python ../.github/scripts/ci/rust_test_results.py report --directory .ci-results --junit target/nextest/ci/junit.xml --output .ci-results/test-results.json --platform windows-x64-msvc --target $env:WORK_RUST_TARGET --min-doc-tests 1
      - name: Upload Rust test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-results-windows-x64-msvc-attempt-${{ github.run_attempt }}
          path: |
            rust/.ci-results/*.json
            rust/.ci-results/doc.log
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce Rust test results
        if: always()
        run: python ../.github/scripts/ci/rust_test_results.py enforce --directory .ci-results --junit target/nextest/ci/junit.xml --min-doc-tests 1
      - name: Build Work and Skill release binaries
        run: python -B ../.github/scripts/ci/rust_validation_steps.py build
      - name: Smoke test Rust binaries
        run: python -B ../.github/scripts/ci/rust_validation_steps.py smoke
      - name: Simulate Host behaviour with the release binaries
        run: python -B ../.github/scripts/ci/rust_validation_steps.py simulation
      - name: Upload Host simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-binary-host-simulation-windows-x64-msvc-attempt-${{ github.run_attempt }}
          path: rust/.ci-results/binary-host-simulation.json
          if-no-files-found: warn
