name: rust validation

on:
  pull_request:
  workflow_call:

jobs:
  validate-and-build-rust-macos:
    name: validate and build rust (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(python3 -B ../.github/scripts/release/rust_toolchain.py)" >> "$GITHUB_ENV"
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: |
          for path in README.md skills/work/SKILL.md rust/crates/work-infrastructure/fixtures/cases/discussion/assembly/valid/project/outputs/work/sources/example/SRC-001/source.txt; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/lf[[:space:]] ]] || { echo "Checkout changed line endings: $entry"; exit 1; }
          done
          for path in os-scripts/windows/clean-codex-data.bat os-scripts/windows/install-work-from-source.bat os-scripts/windows/install-work-from-package.bat os-scripts/windows/install-work-from-github-release.bat; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/crlf[[:space:]] ]] || { echo "Checkout changed batch line endings: $entry"; exit 1; }
          done
      - name: Test CI performance reporter
        run: python3 -B -m unittest discover -s ../.github/scripts/tests/ci-performance -p test_ci_perf.py
      - name: Install Rust components
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          rustup component add clippy rustfmt --toolchain "$RUSTUP_TOOLCHAIN"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo '## Work Rust macOS runner'
            echo "Checkout commit: $commit"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / ${ImageOS:-unknown}"
            sw_vers
            uname -m
            rustc --version
            cargo --version
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile Rust tests
        id: mac_test_compile
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run
      - name: Run Rust unit and integration tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast
      - name: Run Rust doc tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc
      - name: Report Rust performance
        if: always()
        run: python3 ../.github/scripts/ci-performance/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform macos --target native
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-perf-macos
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../.github/scripts/ci-performance/ci_perf.py compare --report .ci-perf/performance.json --workflow publish-release.yml --artifact rust-perf-macos
      - name: Enforce Rust test results
        if: always()
        run: python3 ../.github/scripts/ci-performance/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml
      - name: Build Work release binary
        run: cargo build --release --locked -p work-cli
      - name: Smoke test Rust binary
        run: target/release/work --help

  validate-and-build-rust-windows:
    name: validate and build rust (Windows ${{ matrix.label }})
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MSVC
            target: x86_64-pc-windows-msvc
          - label: GNU
            target: x86_64-pc-windows-gnu
    env:
      WORK_RUST_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Select Rust toolchain
        run: |
          $toolchain = python -B ../.github/scripts/release/rust_toolchain.py --target $env:WORK_RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: |
          $paths = @(
            'README.md',
            'skills/work/SKILL.md',
            'rust/crates/work-infrastructure/fixtures/cases/discussion/assembly/valid/project/outputs/work/sources/example/SRC-001/source.txt'
          )
          foreach ($path in $paths) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/lf\s') {
              throw "Checkout changed line endings for ${path}: $entry"
            }
          }
          $batchPaths = @(
            'os-scripts/windows/clean-codex-data.bat',
            'os-scripts/windows/install-work-from-source.bat',
            'os-scripts/windows/install-work-from-package.bat',
            'os-scripts/windows/install-work-from-github-release.bat'
          )
          foreach ($path in $batchPaths) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/crlf\s') {
              throw "Checkout changed batch line endings for ${path}: $entry"
            }
          }
      - name: Test CI performance reporter
        run: python -B -m unittest discover -s ../.github/scripts/tests/ci-performance -p test_ci_perf.py
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add clippy rustfmt --toolchain $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WORK_RUST_TARGET -eq 'x86_64-pc-windows-gnu') {
            $gcc = (Get-Command gcc -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $machine = & $gcc -dumpmachine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($machine.Trim() -ne 'x86_64-w64-mingw32') {
              throw "Expected a Windows x86_64 MinGW linker, found ${machine}: $gcc"
            }
            "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
            Split-Path -Parent $gcc | Out-File -FilePath $env:GITHUB_PATH -Append
            & $gcc --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: |
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Rust target: $env:WORK_RUST_TARGET" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Checkout commit: $commit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked --target $env:WORK_RUST_TARGET
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked --target $env:WORK_RUST_TARGET -- -D warnings
      - name: Compile Rust tests
        id: windows_test_compile
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run --target $env:WORK_RUST_TARGET
      - name: Run Rust unit and integration tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast --target $env:WORK_RUST_TARGET
      - name: Run Rust doc tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc --target $env:WORK_RUST_TARGET
      - name: Report Rust performance
        if: always()
        run: python ../.github/scripts/ci-performance/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform windows --target $env:WORK_RUST_TARGET --min-doc-tests 1
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-perf-${{ matrix.target }}
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ../.github/scripts/ci-performance/ci_perf.py compare --report .ci-perf/performance.json --workflow publish-release.yml --artifact rust-perf-$env:WORK_RUST_TARGET
      - name: Enforce Rust test results
        if: always()
        run: python ../.github/scripts/ci-performance/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml --min-doc-tests 1
      - name: Build Work release binary
        run: cargo build --release --locked -p work-cli
      - name: Smoke test Rust binary
        run: '& ".\target\release\work.exe" --help'
