name: rust validation

on:
  workflow_call:

jobs:
  validate-and-build-rust-macos:
    name: validate and build rust (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: rust
    steps:
      - &rust_checkout
        name: Check out source for Rust validation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Set up Python for CI tests
        uses: ./.github/actions/setup-rust-validation-python
      - name: Select Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(python3 -B ../.github/scripts/release/rust_toolchain.py)" >> "$GITHUB_ENV"
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: python3 -B .github/scripts/ci/check_checkout_line_endings.py
      - name: Test CI scripts
        run: |
          python3 -B -m unittest discover -s ../.github/scripts/tests/ci -p 'test_*.py'
          python3 -B -m unittest discover -s ../.github/scripts/tests/ci-performance -p 'test_*.py'
      - name: Set up Rust toolchain
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py setup
      - &install_nextest
        name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: python3 -B ../.github/scripts/ci-performance/ci_perf.py environment --platform macos --target native
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile Rust tests
        id: mac_test_compile
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run --timings
      - name: Investigate Rust compilation
        if: steps.mac_test_compile.outcome == 'success'
        run: python3 -B ../.github/scripts/ci-performance/investigate/compile.py --directory .ci-perf
      - name: Run Rust unit and integration tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast
      - name: Run Rust doc tests
        if: steps.mac_test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc
      - name: Probe Rust fixture and process costs
        if: steps.mac_test_compile.outcome == 'success'
        run: python3 -B ../.github/scripts/ci-performance/investigate/probes.py --output .ci-perf/probes --repetitions 10
      - name: Report Rust performance
        if: always()
        run: python3 ../.github/scripts/ci-performance/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform macos --target native --min-doc-tests 1
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-perf-macos
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../.github/scripts/ci-performance/ci_perf.py compare --report .ci-perf/performance.json --workflow publish-release.yml --artifact rust-perf-macos
      - name: Enforce Rust test results
        if: always()
        run: python3 ../.github/scripts/ci-performance/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml --min-doc-tests 1
      - name: Build Work and Tooling release binaries
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py build
      - name: Smoke test Rust binaries
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py smoke
      - name: Verify three Host activation modes
        run: python3 -B ../.github/scripts/ci/rust_validation_steps.py activation
      - name: Upload Host activation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-activation-macos
          path: rust/.ci-perf/host-activation.json
          if-no-files-found: warn

  validate-and-build-rust-windows:
    name: validate and build rust (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      WORK_RUST_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: rust
    steps:
      - *rust_checkout
      - name: Set up Python for CI tests
        uses: ./.github/actions/setup-rust-validation-python
      - name: Select Rust toolchain
        run: |
          $toolchain = python -B ../.github/scripts/release/rust_toolchain.py --target $env:WORK_RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: python -B .github/scripts/ci/check_checkout_line_endings.py
      - name: Test CI scripts
        run: |
          python -B -m unittest discover -s ../.github/scripts/tests/ci -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s ../.github/scripts/tests/ci-performance -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Rust toolchain
        run: python -B ../.github/scripts/ci/rust_validation_steps.py setup
      - *install_nextest
      - name: Record runner environment
        run: python -B ../.github/scripts/ci-performance/ci_perf.py environment --platform windows --target $env:WORK_RUST_TARGET
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked --target $env:WORK_RUST_TARGET
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked --target $env:WORK_RUST_TARGET -- -D warnings
      - name: Compile Rust tests
        id: windows_test_compile
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run --timings --target $env:WORK_RUST_TARGET
      - name: Investigate Rust compilation
        if: steps.windows_test_compile.outcome == 'success'
        run: python -B ../.github/scripts/ci-performance/investigate/compile.py --directory .ci-perf --target $env:WORK_RUST_TARGET
      - name: Run Rust unit and integration tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast --target $env:WORK_RUST_TARGET
      - name: Run Rust doc tests
        if: steps.windows_test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci-performance/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc --target $env:WORK_RUST_TARGET
      - name: Probe Rust fixture and process costs
        if: steps.windows_test_compile.outcome == 'success'
        run: python -B ../.github/scripts/ci-performance/investigate/probes.py --output .ci-perf/probes --repetitions 10 --target $env:WORK_RUST_TARGET
      - name: Report Rust performance
        if: always()
        run: python ../.github/scripts/ci-performance/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform windows --target $env:WORK_RUST_TARGET --min-doc-tests 1
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-perf-x86_64-pc-windows-msvc
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ../.github/scripts/ci-performance/ci_perf.py compare --report .ci-perf/performance.json --workflow publish-release.yml --artifact rust-perf-$env:WORK_RUST_TARGET
      - name: Enforce Rust test results
        if: always()
        run: python ../.github/scripts/ci-performance/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml --min-doc-tests 1
      - name: Build Work and Tooling release binaries
        run: python -B ../.github/scripts/ci/rust_validation_steps.py build
      - name: Smoke test Rust binaries
        run: python -B ../.github/scripts/ci/rust_validation_steps.py smoke
      - name: Verify three Host activation modes
        run: python -B ../.github/scripts/ci/rust_validation_steps.py activation
      - name: Upload Host activation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-activation-windows
          path: rust/.ci-perf/host-activation.json
          if-no-files-found: warn
