[workspace]
members = [
    "crates/common/*",
    "crates/skill/*",
    "crates/work/*",
]
resolver = "3"

[workspace.package]
version = "3.1.1"
edition = "2024"
rust-version = "1.100.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
clap = { version = "4.6.8", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

[profile.test]
opt-level = 1
