[workspace]
members = [
    "crates/skill/*",
    "crates/tooling/*",
    "crates/work/*",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "=0.1.24"
caseless = "=0.2.2"
serde_yaml_ng = "0.10"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "=0.4.3"

[profile.test]
opt-level = 1
